# Taskfile for claimward-vpn-client (shared library + the `claimward` CLI).
# Install go-task: https://taskfile.dev   (pkgx install task)
#
#   task build      # build ./bin/claimward
#   task install    # go install the CLI onto your PATH
version: "3"

vars:
  CLI: claimward
  BIN: bin

tasks:
  default:
    desc: List available tasks
    cmds: [task --list]
    silent: true

  deps:
    desc: Download Go dependencies
    cmds: [go mod download]

  build:
    desc: Build the claimward CLI
    cmds:
      - go build -o {{.BIN}}/{{.CLI}} ./cmd/claimward
    sources:
      - "**/*.go"
    generates:
      - "{{.BIN}}/{{.CLI}}"

  install:
    desc: Install the claimward CLI to GOBIN / $GOPATH/bin
    cmds: [go install ./cmd/claimward]

  proto:
    desc: Regenerate gRPC code from proto/ (protoc via pkgx + Go plugins)
    cmds:
      - cmd: |
          tmp="$(mktemp -d)"
          GOBIN="$tmp" go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          GOBIN="$tmp" go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          PATH="$tmp:$PATH" pkgx protoc --proto_path=proto \
            --go_out=. --go_opt=module=github.com/claimward/claimward-vpn-client \
            --go-grpc_out=. --go-grpc_opt=module=github.com/claimward/claimward-vpn-client \
            proto/routes/v1/routes.proto
          echo "regenerated pkg/routespb"
        silent: true

  fmt:
    desc: Format Go sources
    cmds: [gofmt -w .]

  vet:
    desc: Vet Go sources
    cmds: [go vet ./...]

  tidy:
    desc: Tidy go.mod / go.sum
    cmds: [go mod tidy]

  test:
    desc: Run tests
    cmds: [go test ./...]

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN}}
